baseURL: "https://pheeing.github.io"
locale: ko-kr
title: "코딩잘하자"
timeZone: Asia/Seoul
taxonomies:
  category: categories
  tag: tag
permalinks:
  taxonomy:
    tag: /tags/
    categories: /categories/
  term:
    tag: /tags/:slug/
    categories: /categories/:slug/
pagination:
  pagerSize: 8
markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    codeFences: true
    noClasses: false
    wrapperClass: highlight
    lineNos: false
  tableOfContents:
    startLevel: 2
    endLevel: 4
outputs:
  home: [HTML, RSS, JSON]
  section: [HTML, RSS]
outputFormats:
  JSON:
    mediaType: application/json
    baseName: search-index
    isPlainText: true
    notAlternative: true
params:
  integrations:
    adsenseClient: "ca-pub-2334849691251582" # "ca-pub-0123456789012345" (AdSense 게시자 ID; 자동 광고)
    enableInDevelopment: false # 운영 환경에서만 외부 스크립트 실행
  comments:
    enabled: true
    lazyLoad: true # 댓글 보기 버튼을 누르면 Disqus 연결 (개인정보/성능 고려)
  description: "개발하며 기록하는 작은 공간"
  showReadingTime: true
  author:
    name: "Chloe Kang"
    # static/images/avatar.jpg 에 이미지를 저장하고 아래 주석을 해제하세요.
    avatar: "" # "/images/avatar.jpg"
    bio: "다양한 개발을 하고 있는 개발자 입니다."
    location: "서울"
    email: ""
    links:
      - label: "Email"
        icon: "fas fa-fw fa-envelope-square"
        url: ""
      - label: "Website"
        icon: "fas fa-fw fa-link"
        url: ""
      - label: "GitHub"
        icon: "fab fa-fw fa-github"
        url: "https://github.com/pheeing"
      - label: "Twitter"
        icon: "fab fa-fw fa-twitter-square"
        url: ""
      - label: "Instagram"
        icon: "fab fa-fw fa-instagram"
        url: ""
  footer:
    links:
      - label: "GitHub"
        icon: "fab fa-fw fa-github"
        url: "https://github.com/pheeing"
      - label: "GitLab"
        icon: "fab fa-fw fa-gitlab"
        url: ""
      - label: "Instagram"
        icon: "fab fa-fw fa-instagram"
        url: ""

services:
  googleAnalytics:
    id: "G-NMXBR0H2XX" # "G-XXXXXXXXXX" (GA4 측정 ID)
  disqus:
    shortname: "pheeing" # 기존 Jekyll 블로그의 Disqus shortname